plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.sendwiseforensic.supervisedkeyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.sendwiseforensic.supervisedkeyboard"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"

        // Default API base URL. Override per-buildType after Vercel deploy.
        buildConfigField "String", "API_BASE_URL", "\"https://sendwise-lac.vercel.app\""
        // Certificate pin (SPKI SHA-256, base64). Obtain via CERT_PINNING.md after Vercel deploy.
        buildConfigField "String", "CERT_PIN_SHA256", "\"PLACEHOLDER_UPDATE_AFTER_DEPLOY\""
        // Forensic-console evidence-ingest backend. Placeholder until the
        // console is deployed; see TODO(WIRE-TO-FORENSIC-CONSOLE).
        buildConfigField "String", "BACKEND_URL", "\"https://forensic-console.example.local\""
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('SAFEKEYBOARD_UPLOAD_STORE_FILE')) {
                storeFile file(SAFEKEYBOARD_UPLOAD_STORE_FILE)
                storePassword SAFEKEYBOARD_UPLOAD_STORE_PASSWORD
                keyAlias SAFEKEYBOARD_UPLOAD_KEY_ALIAS
                keyPassword SAFEKEYBOARD_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Preferences
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Security — EncryptedSharedPreferences for per-device salt storage
    // (Android Keystore-backed AES-256 GCM). minSdk 26 satisfies the 21+ requirement.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Room — evidence spool (COLLECTION_GATE_ONLY writes via EvidenceRecorder)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // WorkManager — evidence upload worker (COLLECTION_GATE_ONLY)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // TensorFlow Lite (for Phase 2)
    implementation 'org.tensorflow:tensorflow-lite:2.13.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
}
