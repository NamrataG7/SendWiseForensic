name: Build SupervisedKeyboardApp APK

on:
  push:
    branches:
      - main
    paths:
      - 'SupervisedKeyboardApp/**'
      - '.github/workflows/build-supervised-keyboard-apk.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'SupervisedKeyboardApp/**'
  workflow_dispatch:

jobs:
  build:
    name: Build SupervisedKeyboardApp Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('SupervisedKeyboardApp/**/*.gradle*', 'SupervisedKeyboardApp/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x SupervisedKeyboardApp/gradlew

      - name: Build debug APK
        working-directory: SupervisedKeyboardApp
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SupervisedKeyboardApp-debug-apk
          path: SupervisedKeyboardApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
